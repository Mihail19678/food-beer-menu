<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f04b12"><title>Food Beer Café — меню</title>
<style>
:root{--orange:#f04b12;--gold:#f6ae22;--cream:#fff3df;--green:#175638;--ink:#231b16}*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:var(--orange);color:white;padding:24px 18px 20px;text-align:center}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.9}.top h1{font-size:clamp(30px,8vw,48px);line-height:1;margin:8px}.top p{margin:0}.switch{display:inline-flex;margin-top:16px;padding:4px;background:#9d2e0b;border-radius:999px}.switch button{border:0;border-radius:999px;padding:8px 15px;background:transparent;color:white;font-weight:700}.switch button.active{background:var(--gold);color:#24170b}.wrap{max-width:900px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 16px}.tabs button{white-space:nowrap;border:1px solid #ead8c3;background:white;color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:700}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}.section-title{font-size:26px;margin:10px 0 14px;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:white;border:1px solid #efdfca;border-radius:18px;padding:16px;box-shadow:0 3px 12px #5528000c}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.name{font-size:20px;font-weight:800}.price{flex:none;background:var(--gold);padding:5px 12px;border-radius:999px;font-size:19px;font-weight:850}.desc{color:#695e54;margin:7px 0 0}.unit{font-size:12px;font-weight:600}.extras{margin-top:14px;padding:13px;background:var(--cream);border-radius:14px}.extras h3{margin:0 0 6px}.extras .row{padding:3px 0}.foot{text-align:center;padding:24px 8px;color:#6d6258}.phone{display:inline-block;background:var(--green);color:white;text-decoration:none;border-radius:999px;padding:12px 22px;font-weight:800;margin-top:8px}.sheet{display:block;width:100%;height:auto;border-radius:14px;margin:16px auto}.hint{font-size:13px;color:#75695f}
</style></head><body><header class="top"><div class="brand">Food Beer Café · 2017</div><h1 data-ru="Меню" data-ro="Meniu">Меню</h1><p data-ru="Свежая еда и хорошее настроение" data-ro="Mâncare proaspătă și voie bună">Свежая еда и хорошее настроение</p><div class="switch"><button class="active" data-lang="ru">Русский</button><button data-lang="ro">Română</button></div></header>
<main class="wrap"><nav class="tabs"><button class="active" data-tab="food" data-ru="Фастфуд" data-ro="Fast-food">Фастфуд</button><button data-tab="pizza" data-ru="Пицца" data-ro="Pizza">Пицца</button></nav><section id="content"></section><div class="foot"><div data-ru="Закажите или уточните наличие по телефону" data-ro="Comandați sau verificați disponibilitatea la telefon">Закажите или уточните наличие по телефону</div><a class="phone" href="tel:060536309">060 536 309</a><p class="hint" data-ru="Цены указаны в молдавских леях (MDL)." data-ro="Prețurile sunt în lei moldovenești (MDL).">Цены указаны в молдавских леях (MDL).</p></div></main>
<script>
const data={food:{ru:{title:'Фастфуд и напитки',items:[['Картофель фри','25',''],['Шаурма — большая','60','Лаваш, куриное мясо, картофель фри, капуста, морковь, маринованный огурец, чесночный соус.'],['Шаурма — маленькая','45','Лаваш, куриное мясо, картофель фри, капуста, морковь, маринованный огурец, чесночный соус.'],['Денер','30','Булочка, куриное мясо, картофель фри, капуста, морковь, маринованный огурец, чесночный соус.'],['Хот-дог','25','Булочка, свино-говяжья сосиска, капуста, морковь, чесночный соус, кетчуп.'],['Пиво','15',''],['Квас','12','']],extras:'Добавки',extraItems:[['Сыр','+10'],['Грибы','+10'],['Соусы','+5 (сладкий чили, чесночный, кетчуп, майонез)']]},ro:{title:'Fast-food și băuturi',items:[['Cartofi prăjiți','25',''],['Shaorma — mare','60','Lipie, carne de pui, cartofi prăjiți, varză, morcov, castravete murat, sos de usturoi.'],['Shaorma — mică','45','Lipie, carne de pui, cartofi prăjiți, varză, morcov, castravete murat, sos de usturoi.'],['Döner','30','Chiflă, carne de pui, cartofi prăjiți, varză, morcov, castravete murat, sos de usturoi.'],['Hot-dog','25','Chiflă, crenvurșt din porc și vită, varză, morcov, sos de usturoi, ketchup.'],['Bere','15',''],['Cvas','12','']],extras:'Extra',extraItems:[['Cașcaval','+10'],['Ciuperci','+10'],['Sosuri','+5 (chili dulce, usturoi, ketchup, maioneză)']]}},pizza:{ru:{title:'Пицца · 80 MDL',items:[['Маргарита','80','Сыр моцарелла, сыр гауда, помидоры, соус для пиццы.'],['Бекон','80','Бекон, сыр гауда, грибы, чесночный соус.'],['Колбасная','80','Колбаса, маслины, сыр гауда, перец, соус для пиццы.'],['Куриная','80','Куриное филе, грибы, перец, сыр гауда, соус для пиццы.'],['Острая','80','Колбаски кабанос, сыр гауда, оливки, острый перец, соус для пиццы.']]},ro:{title:'Pizza · 80 MDL',items:[['Margherita','80','Mozzarella, cașcaval gouda, roșii, sos pentru pizza.'],['Cu bacon','80','Bacon, cașcaval gouda, ciuperci, sos de usturoi.'],['Cu salam','80','Salam, măsline, cașcaval gouda, ardei, sos pentru pizza.'],['Cu pui','80','File de pui, ciuperci, ardei, cașcaval gouda, sos pentru pizza.'],['Picantă','80','Cârnați kabanos, cașcaval gouda, măsline, ardei iute, sos pentru pizza.']]}}};let lang='ru',tab='food';
function render(){const d=data[tab][lang];document.querySelector('#content').innerHTML=`<h2 class="section-title">${d.title}</h2><div class="grid">${d.items.map(([n,p,x])=>`<article class="card"><div class="row"><div class="name">${n}</div><div class="price">${p}<span class="unit"> MDL</span></div></div>${x?`<p class="desc">${x}</p>`:''}</article>`).join('')}${d.extras?`<article class="card extras"><h3>${d.extras}</h3>${d.extraItems.map(([n,p])=>`<div class="row"><span>${n}</span><b>${p}</b></div>`).join('')}</article>`:''}</div><img class="sheet" src="${tab==='food'?'menu-fastfood.jpg':'menu-pizza.jpg'}" alt="${lang==='ru'?'Оригинальный дизайн меню':'Designul original al meniului'}">`}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-ru]').forEach(x=>x.textContent=x.dataset[lang]);render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
