<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e98706"><title>Food Beer Café — меню</title>
<style>
:root{--orange:#e98706;--gold:#ffb21c;--cream:#fff9f0;--green:#282321;--ink:#211e1a;--muted:#756d63;--line:#eadfce}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{background:var(--cream);color:var(--ink);padding:18px 18px 22px;text-align:center;border-bottom:4px solid var(--gold)}
.logo{display:block;width:112px;height:108px;object-fit:contain;margin:0 auto 3px}.brand{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--green);margin:0 0 6px;text-transform:uppercase}
.top h1{font-family:Georgia,serif;font-size:clamp(34px,8vw,48px);line-height:1;margin:5px 0 8px}
.top p{margin:0;color:var(--muted);font-size:15px}
.switch{display:inline-flex;gap:3px;margin-top:18px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:999px}
.switch button{border:0;border-radius:999px;padding:8px 15px;background:transparent;color:var(--ink);font-weight:700;font-size:14px}
.switch button.active{background:var(--gold);color:#241a09}
.wrap{max-width:700px;margin:0 auto;padding:22px 17px 18px}
.tabs{display:flex;gap:9px;margin:0 0 22px;border-bottom:1px solid var(--line);padding-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fffdf8;color:var(--green);border-radius:999px;padding:10px 19px;font-weight:750;font-size:15px}
.tabs button.active{background:var(--orange);border-color:var(--orange);color:#fff}
.section-title{font-family:Georgia,serif;font-size:27px;margin:0 0 10px;color:var(--green)}
.grid{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 3px;box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-size:18px;font-weight:750;line-height:1.3}
.price{flex:none;background:var(--orange);color:#fff;padding:6px 13px;border-radius:999px;font-size:16px;font-weight:800;white-space:nowrap}
.unit{font-size:11px;font-weight:650;color:#fff2d8}
.product-line{display:flex;align-items:center;gap:14px}.photo-frame{width:140px;height:140px;flex:0 0 140px;display:flex;align-items:center;justify-content:center;overflow:hidden}.product-photo{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(52,35,18,.18))}.product-copy{min-width:0;flex:1}.desc{color:var(--muted);font-size:14px;line-height:1.45;margin:6px 0 0;max-width:530px}.addon-box{margin-top:10px;padding:10px 12px;background:#fff1d5;border:1px solid #f0d38f;border-radius:12px}.addon-title{font-size:13px;font-weight:800;color:var(--green);margin-bottom:7px}.addon-options{display:flex;flex-wrap:wrap;gap:7px}.addon-option{display:inline-flex;align-items:center;gap:7px;padding:4px 6px 4px 10px;background:#fffdf8;border:1px solid #f2d8a2;border-radius:999px;font-size:13px;font-weight:700}.addon-option .price{font-size:12px;padding:4px 8px}.addon-option .unit{font-size:9px}.size-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.size-option{display:flex;align-items:center;gap:7px;padding:4px 9px;border:1px solid var(--line);background:#fffdf8;border-radius:999px;font-size:13px;font-weight:700}.size-option .price{font-size:13px;padding:4px 9px}.size-option .unit{font-size:9px}
.extras{margin-top:17px;background:#fff1d5;border:1px solid #f3d993;border-radius:15px;padding:15px 16px}
.extras h3{margin:0 0 7px;color:var(--green);font-size:17px}
.extras .row{padding:4px 0;font-size:15px}
.foot{text-align:center;border-top:1px solid var(--line);margin-top:28px;padding:22px 8px 10px;color:var(--muted);font-size:14px}
.phone{display:inline-block;background:var(--orange);color:white;text-decoration:none;border-radius:999px;padding:12px 24px;font-weight:800;font-size:16px;margin-top:11px}
.hint{font-size:12px;color:#8a8176;margin:12px 0 0}.foot-details{display:grid;gap:5px;margin-top:15px;font-size:13px}.foot-details strong{color:var(--green)}.instagram{color:var(--green);font-weight:700;text-decoration:none;margin-top:4px;display:inline-block}.instagram:hover{text-decoration:underline}@media(max-width:420px){.photo-frame{width:104px;height:104px;flex-basis:104px}.product-line{gap:10px}.name{font-size:17px}.addon-option{font-size:12px}}
</style></head><body><header class="top"><img class="logo" src="logo-transparent.png" alt="Food Beer Café"><div class="brand">FOOD BEER CAFÉ · 2017</div><h1 data-ru="Меню" data-ro="Menu">Меню</h1><p data-ru="Свежая еда и хорошее настроение" data-ro="Mâncare proaspătă și voie bună">Свежая еда и хорошее настроение</p><div class="switch"><button class="active" data-lang="ru">Русский</button><button data-lang="ro">Română</button></div></header>
<main class="wrap"><nav class="tabs"><button class="active" data-tab="food" data-ru="Фастфуд" data-ro="Fast-food">Фастфуд</button><button data-tab="pizza" data-ru="Пицца" data-ro="Pizza">Пицца</button></nav><section id="content"></section><div class="foot"><div data-ru="Закажите или уточните наличие по телефону" data-ro="Comandați sau verificați disponibilitatea la telefon">Закажите или уточните наличие по телефону</div><a class="phone" href="tel:060536309">060 536 309</a><div class="foot-details"><div><strong data-ru="Время работы:" data-ro="Program:">Время работы:</strong> 9:00–21:00</div><div><strong data-ru="Адрес:" data-ro="Adresa:">Адрес:</strong> <span data-ru="ул. Юрия Гагарина, 42, Вулканешты, Молдова" data-ro="str. Iurie Gagarin, 42, Vulcănești, Republica Moldova">ул. Юрия Гагарина, 42, Вулканешты, Молдова</span></div><a class="instagram" href="https://www.instagram.com/cafe_food_beer?obrf=MTA0ajFidmZqdHdmaw==" target="_blank" rel="noopener noreferrer">Instagram ↗</a></div></div></main>
<script>
const data={
food:{
 ru:{title:'Фастфуд и напитки',items:[
  {name:'Картофель фри',price:'25',img:'fries-sauces.png',addons:{title:'Соусы',options:[['Сладкий чили','+5'],['Чесночный','+5'],['Кетчуп','+5'],['Майонез','+5']]}},
  {name:'Шаурма',desc:'Лаваш, куриное мясо, картофель фри, капуста, морковь, маринованный огурец, чесночный соус.',img:'product-shawarma.png?v=2',sizes:[['Большая','60'],['Маленькая','45']],addons:{title:'Добавки',options:[['Сыр','+10'],['Грибы','+10']]}},
  {name:'Дёнер',price:'30',desc:'Булочка, куриное мясо, картофель фри, капуста, морковь, маринованный огурец, чесночный соус.',img:'product-doner.png?v=3',large:true},
  {name:'Хот-дог',price:'25',desc:'Булочка, свино-говяжья сосиска, капуста, морковь, чесночный соус, кетчуп.',img:'product-hotdog.png'},
  {name:'Пиво',price:'15',img:'drink-beer.png'},
  {name:'Квас',price:'12',img:'drink-kvass.png'}
 ]},
 ro:{title:'Fast-food și băuturi',items:[
  {name:'Cartofi pai',price:'25',img:'fries-sauces.png',addons:{title:'Sosuri',options:[['Chili dulce','+5'],['Usturoi','+5'],['Ketchup','+5'],['Maioneză','+5']]}},
  {name:'Shaorma',desc:'Lipie, carne de pui, cartofi pai, varză, morcov, castravete murat, sos de usturoi.',img:'product-shawarma.png?v=2',sizes:[['Mare','60'],['Mică','45']],addons:{title:'Extra',options:[['Cașcaval','+10'],['Ciuperci','+10']]}},
  {name:'Doner',price:'30',desc:'Chiflă, carne de pui, cartofi pai, varză, morcov, castravete murat, sos de usturoi.',img:'product-doner.png?v=3',large:true},
  {name:'Hot-dog',price:'25',desc:'Chiflă, crenvurșt din porc și vită, varză, morcov, sos de usturoi, ketchup.',img:'product-hotdog.png'},
  {name:'Bere',price:'15',img:'drink-beer.png'},
  {name:'Cvas',price:'12',img:'drink-kvass.png'}
 ]}
},
pizza:{
 ru:{title:'Пицца · 80 MDL',items:[
  {name:'Маргарита',price:'80',desc:'Сыр моцарелла, сыр гауда, помидоры, соус для пиццы.',img:'pizza-margherita.png'},
  {name:'Пицца с беконом',price:'80',desc:'Бекон, сыр гауда, грибы, чесночный соус.',img:'pizza-bacon.png'},
  {name:'Колбасная',price:'80',desc:'Колбаса, маслины, сыр гауда, перец, соус для пиццы.',img:'pizza-salami.png'},
  {name:'Куриная',price:'80',desc:'Куриное филе, грибы, перец, сыр гауда, соус для пиццы.',img:'pizza-chicken.png'},
  {name:'Острая',price:'80',desc:'Колбаски кабанос, сыр гауда, оливки, острый перец, соус для пиццы.',img:'pizza-spicy.png'}
 ]},
 ro:{title:'Pizza · 80 MDL',items:[
  {name:'Pizza Margherita',price:'80',desc:'Mozzarella, cașcaval gouda, roșii, sos pentru pizza.',img:'pizza-margherita.png'},
  {name:'Pizza cu bacon',price:'80',desc:'Bacon, cașcaval gouda, ciuperci, sos de usturoi.',img:'pizza-bacon.png'},
  {name:'Pizza cu salam',price:'80',desc:'Salam, măsline, cașcaval gouda, ardei, sos pentru pizza.',img:'pizza-salami.png'},
  {name:'Pizza cu pui',price:'80',desc:'File de pui, ciuperci, ardei, cașcaval gouda, sos pentru pizza.',img:'pizza-chicken.png'},
  {name:'Pizza picantă',price:'80',desc:'Cârnați kabanos, cașcaval gouda, măsline, ardei iute, sos pentru pizza.',img:'pizza-spicy.png'}
 ]}
}
};let lang='ru',tab='food';
function render(){const d=data[tab][lang];const badge=value=>`<div class="price">${value}<span class="unit"> MDL</span></div>`;document.querySelector('#content').innerHTML=`<h2 class="section-title">${d.title}</h2><div class="grid">${d.items.map(item=>`<article class="card"><div class="product-line">${item.img?`<div class="photo-frame"><img class="product-photo" src="${item.img}" alt="${item.name}"></div>`:''}<div class="product-copy"><div class="row"><div class="name">${item.name}</div>${item.price?badge(item.price):''}</div>${item.sizes?`<div class="size-options">${item.sizes.map(([label,value])=>`<div class="size-option"><span>${label}</span>${badge(value)}</div>`).join('')}</div>`:''}${item.desc?`<p class="desc">${item.desc}</p>`:''}${item.addons?`<div class="addon-box"><div class="addon-title">${item.addons.title}</div><div class="addon-options">${item.addons.options.map(([label,value])=>`<div class="addon-option">${label}${badge(value)}</div>`).join('')}</div></div>`:''}</div></div></article>`).join('')}</div>`}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-ru]').forEach(x=>x.textContent=x.dataset[lang]);render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
